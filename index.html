<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кумир — решения</title>
<style>
:root{--bg:#16181d;--card:#1f2229;--text:#e8eaed;--muted:#8b909a;--accent:#4f8cff}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#fff;--text:#1b1e24;--muted:#6b7280;--accent:#2563eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{margin:0 0 4px;font-size:1.6rem}
p.sub{margin:0 0 24px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--text);border:2px solid transparent;border-radius:10px;padding:10px 18px;font-size:1rem;cursor:pointer}
.tabs button:hover{border-color:var(--accent)}
.tabs button.active{background:var(--accent);color:#fff}
.box{background:var(--card);border-radius:12px;padding:16px;position:relative}
.box h2{margin:0 0 12px;font-size:1.1rem}
pre{margin:0;font-family:Consolas,Menlo,monospace;font-size:1rem;line-height:1.5;overflow-x:auto;white-space:pre}
.copy{position:absolute;top:12px;right:12px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Кумир — решения</h1>
<p class="sub">Выбери задание, и появится код</p>
<div class="tabs" id="tabs"></div>
<div class="box" id="box"></div>
</main>

};

const order = ["2", "3", "3.1", "4"];
const tabs = document.getElementById("tabs");
const box = document.getElementById("box");

function show(n) {
  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.n === n);
  });
  const code = tasks[n];
  box.innerHTML = "";
  const h = document.createElement("h2");
  h.textContent = "Задание " + n;
  box.appendChild(h);
  if (!code) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Код для этого задания пока не добавлен";
    box.appendChild(p);
    return;
  }
  const btn = document.createElement("button");
  btn.className = "copy";
  btn.textContent = "Копировать";
  btn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(code);
      btn.textContent = "Скопировано";
    } catch (e) {
      btn.textContent = "Не вышло";
    }
    setTimeout(() => btn.textContent = "Копировать", 1500);
  };
  const pre = document.createElement("pre");
  pre.textContent = code;
  box.appendChild(btn);
  box.appendChild(pre);
}

order.forEach(n => {
  const b = document.createElement("button");
  b.dataset.n = n;
  b.textContent = "Задание " + n;
  b.onclick = () => show(n);
  tabs.appendChild(b);
});

show("3.1");
</script>
